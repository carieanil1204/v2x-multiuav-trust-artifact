# ==============================================================================
# experiment_multiuav.conf  —  Multi‑UAV experiment configuration
#
# This file extends the single‑UAV baseline in ``experiment_realistic.conf`` and
# adds parameters required for the multi‑zone, multi‑UAV trust architecture.
# It is intended to be sourced by ``launch_pipeline_generic.sh``.  All
# variables defined here override values from the base config.  See
# ``MULTIUAV_CONTEXT.md`` for additional context.

# First pull in the baseline configuration.  This makes all of the
# single‑UAV settings available so we only need to override what changes.
source "$(dirname "${BASH_SOURCE[0]}")/experiment_realistic.conf"

# -----------------------------------------------------------------------------
# Experiment identity and NS3 binary
#
# Use the multi‑UAV NS3 binary and update the experiment name so logs and
# outputs are clearly distinguished from single‑UAV runs.
EXP_NAME="v90-multi-uav"
NS3_BINARY="unified_v90_multiuav"
NS3_TARGET="unified_v90_multiuav"

# -----------------------------------------------------------------------------
# Simulation time override
#
# BUG-FIX: the base config sets NS3_SIM_TIME="45" which is far too short.
# With zoneLength=1800 m and speedNormal=20 m/s:
#   - Cars reach the handover trigger (x=1400 m) at t=70 s
#   - Cars exit zone 1 at t=90 s
#   - Cars exit zone 2 at t=180 s
# 180 s gives full coverage of both zones plus a settle margin.
NS3_SIM_TIME="180"

# -----------------------------------------------------------------------------
# Multi‑UAV parameters
#
# nUAVs: number of UAVs in the simulation. 2 indicates two zones (Zone 1 and
# Zone 2).  The UAV positions are derived from the zone length and overlap.
NS3_N_UAVS="2"

# Zone geometry.  Each zone has a length of 1.8 km by default (see
# MULTIUAV_CONTEXT.md).  The second UAV starts at x=1800 m and ends at 3600 m.
# To ensure that the simulator uses a 1.8 km zone length instead of
# auto‑computing it from speedNormal×simTime, explicitly set the zone length.
NS3_ZONE_LENGTH="1800.0"
# Set the X‑coordinate for the start of the second UAV zone.  This parameter is
# not consumed by NS3 directly but serves as documentation and may be used by
# custom scripts.
NS3_UAV2_X="3600.0"

# Overlap between adjacent zones in metres.  Cars spend time in the overlap
# region where both UAVs cover them.  Default is 200 m.
NS3_ZONE_OVERLAP_M="200.0"

# Distance from the end of a zone at which the NS3 application will trigger a
# trust handover.  This value should exceed the cloud RTT (2.5 s at 20 m/s
# yields ≈50 m) to ensure the handover completes before entering the overlap.
NS3_HANDOVER_LEAD_M="400.0"

# Handover-defense parameters
HANDOVER_SAFEWIN_DECAY="0.30"
POST_HANDOVER_K="8"
POST_HANDOVER_REP_FACTOR="0.25"
POST_HANDOVER_DISABLE_UPGRADE="1"
NS3_POST_HANDOVER_PROBATION_PKTS="8"
NS3_POST_HANDOVER_CREDIT_FACTOR="0.25"
NS3_POST_HANDOVER_DISABLE_UPGRADE="1"
LEDGER_OTHER_ZONE_DECAY="0.30"
LEDGER_RECENT_WINDOW_S="120.0"
POST_HANDOVER_LEDGER_FACTOR="0.25"

# -----------------------------------------------------------------------------
# Trust coordinator and zone‑2 infrastructure
#
# The trust coordinator routes trust state from an exiting zone to the next
# zone.  Zone 1 edge and bridge ports remain as defined in the base config.
COORDINATOR_PORT="9997"
COORDINATOR_HOST="127.0.0.1"
COORD_SCRIPT="${PROJECT_ROOT}/scratch/trust_coordinator_v2_handover_defense.py"

# Zone 1 uses the same edge/bridge scripts as zone 2 for multi‑UAV mode.
EDGE_SCRIPT="${PROJECT_ROOT}/scratch/edge_ai_server_v91_handover_defense.py"
BRIDGE_SCRIPT="${PROJECT_ROOT}/scratch/edge_cloud_bridge_v8_handover_passthrough.py"

# Zone 2 edge and bridge definitions.  Zone 2 runs on the same host but
# different ports.  Use the same scripts as zone 1.
EDGE2_PORT="9995"
BRIDGE2_PORT="9996"
EDGE2_SCRIPT="${PROJECT_ROOT}/scratch/edge_ai_server_v91_handover_defense.py"
BRIDGE2_SCRIPT="${PROJECT_ROOT}/scratch/edge_cloud_bridge_v8_handover_passthrough.py"

# -----------------------------------------------------------------------------
# Override NS3 run command to pass multi‑UAV arguments
#
# [REVERTED 2026-06-19] --MinSafeWinsBeforeBan and --WarnForceBanStreak were
# previously passed here using NS3_MIN_SAFE_WINS_BEFORE_BAN=0 and
# NS3_WARN_FORCE_BAN_STREAK=999 from experiment_realistic.conf. Those values
# are leftover from an earlier exploratory debugging session, NOT validated
# production settings -- passing MinSafeWinsBeforeBan=0 disabled the FPR
# guard entirely, causing honest cars to be force-banned (FPR up to 100% in
# multi-UAV smoke-test seeds 3/5/6). Both flags are now omitted so the
# compiled binary defaults apply instead: MIN_SAFE_WINS_BEFORE_BAN=5,
# WARN_FORCE_BAN_STREAK=25 (unified_v90_multiuav.cc lines 285, 291) -- the
# values actually validated against Paper 1's known-good results. Do not
# re-add either flag without re-running the full smoke-test seed sweep.
#
# Extend the command line used to launch NS3 to include multi‑UAV parameters.
# Note: the `CoordAddr` is set to the HPC master IP so NS3 can reach the
# coordinator via the same interface used for edge and bridge communication.
#
# BUG-FIX: --ZoneLength must match the cmd.AddValue("ZoneLength",...) name in
# unified_v90_multiuav.cc exactly (capital Z).  The previous --zoneLength
# (lowercase z) was silently rejected by NS3 CommandLine and the zone length
# fell back to the auto-computed default (speedNormal * simTime = 3600 m),
# which is double the intended zone length.

NS3_EXTRA_HINT="--EdgeAddr=${HPCMASTER_IP} --EdgePort=${BRIDGE_PORT} --InternalCloud=${NS3_INTERNAL_CLOUD} --CloudAddr=${CLOUD_HOST} --CloudPort=${CLOUD_PORT}"
NS3_RUN_CMD="./ns3 run \"${NS3_BINARY} \
  --nCars=${NS3_N_CARS} \
  --attackRate=${NS3_ATTACK_RATE} \
  --attackType=${NS3_ATTACK_TYPE} \
  --RngRun=${RNGRUN} \
  --PktDropRate=${NS3_PKT_DROP_RATE} \
  --EdgePort=${BRIDGE_PORT} \
  --EdgeAddr=${HPCMASTER_IP} \
  --InternalCloud=${NS3_INTERNAL_CLOUD} \
  --CloudAddr=${CLOUD_HOST} \
  --CloudPort=${CLOUD_PORT} \
  --simTime=${NS3_SIM_TIME} \
  --BanReward=${NASH_BAN_REWARD} \
  --ChaseCost=${NASH_CHASE_COST} \
  --NashPStar=${NASH_P_STAR} \
  --GameRs=${NS3_GAME_RS} \
  --GameCf=${NS3_GAME_CF} \
  --CreditDiscountMax=${NS3_CREDIT_DISCOUNT_MAX} \
  --CreditDiscountPerWin=${NS3_CREDIT_DISCOUNT_PER_WIN} \
  --FinalBanWindow=${NS3_FINAL_BAN_WINDOW} \
  --FinalBanReq=${NS3_FINAL_BAN_REQ} \
  --CloudWindow=${NS3_CLOUD_WINDOW_S} \
  --CloudMaxPkts=${NS3_CLOUD_MAX_PKTS} \
  --CloudScrAlert=${NS3_CLOUD_SCR_ALERT} \
  --CloudMinAlertPkts=${NS3_CLOUD_MIN_ALERT_PKTS} \
  --TsOffset=${NS3_TS_OFFSET} \
  --SpdFactor=${NS3_SPD_FACTOR} \
  --EdgeLatencyMs=${NS3_EDGE_LATENCY_MS} \
  --CloudLatencyMs=${NS3_CLOUD_LATENCY_MS} \
  --LaneCount=${NS3_LANE_COUNT} \
  --Reward=${NASH_REWARD} \
  --FalseBanCost=${NASH_FALSE_BAN_COST} \
  --CarSpacingMeters=${NS3_CAR_SPACING} \
  --LaneGapMeters=${NS3_LANE_GAP} \
  --PerLaneStartSkew=${NS3_PER_LANE_SKEW} \
  --PerWaveStartSkew=${NS3_PER_WAVE_SKEW} \
  --StartWaveRows=${NS3_START_WAVE_ROWS} \
  --AutoExtendSimTime=${NS3_AUTO_EXTEND} \
  --SettleMarginSeconds=${NS3_SETTLE_MARGIN} \
  --SpeedNormal=${NS3_SPEED_NORMAL} \
  --SpeedAttack=${NS3_SPEED_ATTACK} \
  --TemptationMin=${NS3_TEMPTATION_MIN} \
  --TemptationMax=${NS3_TEMPTATION_MAX} \
  --ObsNoiseSigma=${NS3_OBS_NOISE_SIGMA} \
  --nUAVs=${NS3_N_UAVS} \
  --ZoneOverlapM=${NS3_ZONE_OVERLAP_M} \
  --HandoverLeadM=${NS3_HANDOVER_LEAD_M} \
  --ZoneLength=${NS3_ZONE_LENGTH} \
  --PostHandoverProbationPkts=${NS3_POST_HANDOVER_PROBATION_PKTS} \
  --PostHandoverCreditFactor=${NS3_POST_HANDOVER_CREDIT_FACTOR} \
  --PostHandoverDisableUpgrade=${NS3_POST_HANDOVER_DISABLE_UPGRADE} \
  --CoordAddr=${HPCMASTER_IP} \
  --CoordPort=${COORDINATOR_PORT}\""
